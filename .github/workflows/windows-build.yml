name: Windows desktop build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Locate OpenSSL for TLS adapter fixtures
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $openssl = @((Join-Path $env:ProgramFiles 'Git/usr/bin/openssl.exe'), (Join-Path $env:ProgramFiles 'Git/mingw64/bin/openssl.exe')) | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $openssl) { throw 'OpenSSL is required to create local TLS test fixtures.' }
            (Split-Path $openssl) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Test application behavior
        run: npm test
      - name: Install browser test runtime
        run: npx playwright install chromium
      - name: Test desktop interface workflows
        id: browser_tests
        run: npm run test:ui -- --reporter=list,github
      - name: Retain browser failure diagnostics
        if: ${{ failure() && steps.browser_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickPrint-Browser-Failure-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Build installer and portable executable
        run: npm run build:win
      - name: Install QuickPrint for the current user
        shell: pwsh
        run: |
          $setup = (Get-ChildItem 'dist/QuickPrint-Setup-*-x64.exe').FullName
          $install = Join-Path $env:RUNNER_TEMP 'QuickPrint-installed'
          $process = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$install") -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'QuickPrint installer timed out.' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $install 'QuickPrint.exe'))) {
            throw 'QuickPrint installer did not produce a runnable application.'
          }
      - name: Smoke test packaged application, credentials and CAD resources
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'quickprint-smoke.json'
          $data = Join-Path $env:RUNNER_TEMP 'quickprint-smoke-data'
          $exe = Join-Path $env:RUNNER_TEMP 'QuickPrint-installed/QuickPrint.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "--smoke-report=$report", "--data-dir=$data") -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Packaged QuickPrint did not complete its smoke test within 60 seconds.'
          }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "QuickPrint exited with $($process.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.packaged -or $result.credentialRoundTrip -ne 'passed' -or $result.cadWorkers.extracted -ne $true -or $result.cadWorkers.count -ne 2 -or $result.hollowGridWorker.executed -ne $true -or $result.hollowGridWorker.count -ne 2 -or $result.hollowGridWorker.disposition -ne 'nonconforming' -or $result.hollowFinalGridWorker.executed -ne $true -or $result.hollowFinalGridWorker.count -ne 4 -or $result.hollowFinalGridWorker.inputBuffersTransferred -ne 6 -or $result.hollowFinalGridWorker.disposition -ne 'nonconforming' -or $result.windowsNativeJob.executed -ne $true -or $result.windowsNativeJob.count -ne 3 -or $result.windowsNativeJob.nativeExitCode -ne 7 -or $result.windowsNativeJob.resourceReceipt.assignedAtCreation -ne $true -or $result.windowsNativeJob.resourceReceipt.memoryAccounting -ne 'committed-virtual-memory-not-rss' -or $result.windowsNativeJob.resourceReceipt.processCommitLimitBytes -ne 1073741824 -or $result.windowsNativeJob.resourceReceipt.jobCommitLimitBytes -ne 1073741824 -or $result.controlledHollow.executed -ne $true -or $result.controlledHollow.controllerInitialized -ne $true -or $result.controlledHollow.adapterRejectedUntrustedRecord -ne $true -or $result.controlledHollow.asyncSourceVerification -ne $true -or $result.controlledHollow.missingProviderRejected -ne $true -or $result.controlledHollow.failureCode -cne 'ENOENT' -or $result.controlledHollow.nativeCalls -ne 0 -or $result.controlledHollow.count -ne 30) {
            throw 'QuickPrint packaged startup, credentials, worker resources, controlled hollow initialization or hard native job guard failed.'
          }
          Copy-Item $report 'dist/windows-smoke-test.json'
      - name: Smoke test the portable executable
        shell: pwsh
        run: |
          $exe = (Get-ChildItem 'dist/QuickPrint-Portable-*-x64.exe').FullName
          $report = Join-Path $env:RUNNER_TEMP 'quickprint-portable-smoke.json'
          $data = Join-Path $env:RUNNER_TEMP 'quickprint-portable-data'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "--smoke-report=$report", "--data-dir=$data") -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'QuickPrint portable startup timed out.' }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Portable QuickPrint exited with $($process.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.packaged -or $result.credentialRoundTrip -ne 'passed' -or $result.cadWorkers.extracted -ne $true -or $result.cadWorkers.count -ne 2 -or $result.hollowGridWorker.executed -ne $true -or $result.hollowGridWorker.count -ne 2 -or $result.hollowGridWorker.disposition -ne 'nonconforming' -or $result.hollowFinalGridWorker.executed -ne $true -or $result.hollowFinalGridWorker.count -ne 4 -or $result.hollowFinalGridWorker.inputBuffersTransferred -ne 6 -or $result.hollowFinalGridWorker.disposition -ne 'nonconforming' -or $result.windowsNativeJob.executed -ne $true -or $result.windowsNativeJob.count -ne 3 -or $result.windowsNativeJob.nativeExitCode -ne 7 -or $result.windowsNativeJob.resourceReceipt.assignedAtCreation -ne $true -or $result.windowsNativeJob.resourceReceipt.memoryAccounting -ne 'committed-virtual-memory-not-rss' -or $result.windowsNativeJob.resourceReceipt.processCommitLimitBytes -ne 1073741824 -or $result.windowsNativeJob.resourceReceipt.jobCommitLimitBytes -ne 1073741824 -or $result.controlledHollow.executed -ne $true -or $result.controlledHollow.controllerInitialized -ne $true -or $result.controlledHollow.adapterRejectedUntrustedRecord -ne $true -or $result.controlledHollow.asyncSourceVerification -ne $true -or $result.controlledHollow.missingProviderRejected -ne $true -or $result.controlledHollow.failureCode -cne 'ENOENT' -or $result.controlledHollow.nativeCalls -ne 0 -or $result.controlledHollow.count -ne 30) {
            throw 'QuickPrint portable startup, credentials, worker resources, controlled hollow initialization or hard native job guard failed.'
          }
          Copy-Item $report 'dist/windows-portable-smoke-test.json'
      - name: Verify packaged worker, controlled hollow and native guard source hashes
        shell: pwsh
        run: |
          foreach ($reportPath in @('dist/windows-smoke-test.json', 'dist/windows-portable-smoke-test.json')) {
            $report = Get-Content $reportPath -Raw | ConvertFrom-Json
            $groups = @(
              @{ field = 'hollowGridWorker'; names = @('resin-hollow-grid-worker.js', 'resin-hollow-grid.js') },
              @{ field = 'hollowFinalGridWorker'; names = @('resin-hollow-final-grid-async.js', 'resin-hollow-final-grid-worker.js', 'resin-hollow-final-grid.js', 'resin-hollow-grid.js') },
              @{ field = 'windowsNativeJob'; names = @('windows-native-job.js', 'windows-native-job.ps1', 'windows-native-job.cs') },
              @{ field = 'controlledHollow'; names = @('resin-hollow-engine.js', 'resin-controlled-capture.js', 'windows-native-job.js', 'windows-native-job.ps1', 'windows-native-job.cs', 'resin-hollow-inputs.js', 'resin-hollow-preset.js', 'resin-hollow-resolution.js', 'resin-hollow-plan.js', 'resin-hollow-supports.js', 'resin-hollow-audit.js', 'resin-hollow-final-audit.js', 'resin-hollow-raster.js', 'resin-hollow-grid-async.js', 'resin-hollow-final-grid-async.js', 'resin-geometry.js', 'resin-mesh.js', 'resin-plate.js', 'resin-plate-engine.js', 'resin-engine.js', 'resin-profiles.js', 'psam/zip-inspection.js', 'resin-hollow-grid-worker.js', 'resin-hollow-grid.js', 'resin-hollow-final-grid-worker.js', 'resin-hollow-final-grid.js', 'resin-hollow-plate.js', 'goo-replication.js', 'goo-plate.js', 'goo.js') }
            )
            foreach ($group in $groups) {
              foreach ($workerName in $group.names) {
                $actual = @($report.($group.field).files | Where-Object { $_.name -ceq $workerName })
                if ($actual.Count -ne 1) { throw "Packaged resource report is missing a unique $workerName." }
                $sourcePath = Join-Path 'src/slicing' $workerName
                $sourceSha256 = (Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($actual[0].sha256 -cne $sourceSha256) { throw "Packaged resource differs from the checked-out source: $workerName." }
                Write-Host "Verified $reportPath $workerName $sourceSha256"
              }
            }
          }
      - name: Verify the installer can be uninstalled
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'QuickPrint-installed'
          $process = Start-Process -FilePath (Join-Path $install 'Uninstall QuickPrint.exe') -ArgumentList '/S' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'QuickPrint uninstaller timed out.' }
          for ($attempt = 0; $attempt -lt 30 -and (Test-Path (Join-Path $install 'QuickPrint.exe')); $attempt++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $install 'QuickPrint.exe')) { throw 'QuickPrint executable remained after uninstall.' }
      - name: Upload Windows builds and validation report
        uses: actions/upload-artifact@v4
        with:
          name: QuickPrint-Windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS.txt
            dist/release-manifest.json
            dist/windows-smoke-test.json
            dist/windows-portable-smoke-test.json
          if-no-files-found: error
          retention-days: 30
