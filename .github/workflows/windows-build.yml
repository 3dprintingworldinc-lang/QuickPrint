name: Windows desktop build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Locate OpenSSL for TLS adapter fixtures
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $openssl = @((Join-Path $env:ProgramFiles 'Git/usr/bin/openssl.exe'), (Join-Path $env:ProgramFiles 'Git/mingw64/bin/openssl.exe')) | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $openssl) { throw 'OpenSSL is required to create local TLS test fixtures.' }
            (Split-Path $openssl) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Test application behavior
        run: npm test
      - name: Install browser test runtime
        run: npx playwright install chromium
      - name: Test desktop interface workflows
        run: npm run test:ui -- --reporter=list,github
      - name: Build installer and portable executable
        run: npm run build:win
      - name: Install QuickPrint for the current user
        shell: pwsh
        run: |
          $setup = (Get-ChildItem 'dist/QuickPrint-Setup-*-x64.exe').FullName
          $install = Join-Path $env:RUNNER_TEMP 'QuickPrint-installed'
          $process = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$install") -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'QuickPrint installer timed out.' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $install 'QuickPrint.exe'))) {
            throw 'QuickPrint installer did not produce a runnable application.'
          }
      - name: Smoke test packaged application and Windows credential encryption
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'quickprint-smoke.json'
          $data = Join-Path $env:RUNNER_TEMP 'quickprint-smoke-data'
          $exe = Join-Path $env:RUNNER_TEMP 'QuickPrint-installed/QuickPrint.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "--smoke-report=$report", "--data-dir=$data") -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Packaged QuickPrint did not complete its smoke test within 60 seconds.'
          }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "QuickPrint exited with $($process.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.packaged -or $result.credentialRoundTrip -ne 'passed') {
            throw 'QuickPrint packaged startup or credential-encryption check failed.'
          }
          Copy-Item $report 'dist/windows-smoke-test.json'
      - name: Smoke test the portable executable
        shell: pwsh
        run: |
          $exe = (Get-ChildItem 'dist/QuickPrint-Portable-*-x64.exe').FullName
          $report = Join-Path $env:RUNNER_TEMP 'quickprint-portable-smoke.json'
          $data = Join-Path $env:RUNNER_TEMP 'quickprint-portable-data'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "--smoke-report=$report", "--data-dir=$data") -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'QuickPrint portable startup timed out.' }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Portable QuickPrint exited with $($process.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.packaged -or $result.credentialRoundTrip -ne 'passed') {
            throw 'QuickPrint portable startup or credential-encryption check failed.'
          }
          Copy-Item $report 'dist/windows-portable-smoke-test.json'
      - name: Verify the installer can be uninstalled
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'QuickPrint-installed'
          $process = Start-Process -FilePath (Join-Path $install 'Uninstall QuickPrint.exe') -ArgumentList '/S' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'QuickPrint uninstaller timed out.' }
          for ($attempt = 0; $attempt -lt 30 -and (Test-Path (Join-Path $install 'QuickPrint.exe')); $attempt++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $install 'QuickPrint.exe')) { throw 'QuickPrint executable remained after uninstall.' }
      - name: Upload Windows builds and validation report
        uses: actions/upload-artifact@v4
        with:
          name: QuickPrint-Windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS.txt
            dist/release-manifest.json
            dist/windows-smoke-test.json
            dist/windows-portable-smoke-test.json
          if-no-files-found: error
          retention-days: 30
